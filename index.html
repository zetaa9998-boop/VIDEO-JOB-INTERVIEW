<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Interview - Interactive Learning Video | Grade XII</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07152f;color:#fff}
.app{max-width:1200px;margin:auto;background:#0b1d3d;min-height:100vh}
header{padding:22px 25px;background:linear-gradient(135deg,#123b82,#2563eb)}
header h1{margin:0;font-size:30px} header p{margin:7px 0 0}
.player{position:relative;background:#000;overflow:hidden}
.visual{width:100%;height:min(68vh,680px);object-fit:contain;display:block;background:#000}
.overlay{position:absolute;left:20px;right:20px;bottom:20px;background:linear-gradient(transparent,#000d);padding:55px 10px 10px}
.scene{font-size:26px;font-weight:800}.topic{color:#bfdbfe;margin-top:4px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 18px;background:#102751}
button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
.primary{background:#3b82f6;color:#fff}.secondary{background:#475569;color:#fff}.green{background:#10b981;color:#fff}.orange{background:#f59e0b;color:#111}
.timeline{height:9px;background:#334155;border-radius:99px;flex:1;min-width:180px;cursor:pointer}
.timeline span{display:block;height:100%;width:0;background:#60a5fa;border-radius:99px}
.counter{min-width:65px;text-align:center;font-weight:700}
.lesson{background:#f8fafc;color:#172033;padding:25px}
.lesson h2{color:#1d4ed8;margin-top:0}.lesson p{line-height:1.7;font-size:17px}
.key{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.box{background:#eef6ff;border-left:5px solid #2563eb;padding:15px;border-radius:8px}
.box h3{margin:0 0 7px;color:#1e40af}.box p{margin:0}
.caption{background:#0f2b57;color:white;padding:18px 24px;line-height:1.7}
.caption strong{color:#93c5fd}
.progressText{font-size:13px;color:#cbd5e1}
@media(max-width:700px){
header h1{font-size:22px}.visual{height:50vh}.scene{font-size:20px}.key{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>💼 Job Interview — Learning Video</h1>
<p>Grade XII SMK | English for the World of Work</p>
</header>

<div class="player">
<img id="visual" class="visual" src="job-interview-overview.png" alt="Job interview learning material">
<div class="overlay">
<div id="scene" class="scene">1. What Is a Job Interview?</div>
<div id="topic" class="topic">Introduction</div>
</div>
</div>

<div class="controls">
<button id="back" class="secondary">◀ Previous</button>
<button id="play" class="primary">▶ Play Lesson</button>
<button id="next" class="secondary">Next ▶</button>
<button id="voice" class="green">🔊 Voice: ON</button>
<div id="timeline" class="timeline"><span id="bar"></span></div>
<div id="counter" class="counter">1/10</div>
</div>

<div class="caption">
<strong>🎙️ Narration / Subtitle</strong>
<div id="narration">Welcome to our lesson about job interviews.</div>
</div>

<div class="lesson">
<h2 id="lessonTitle">What Is a Job Interview?</h2>
<p id="lessonText"></p>
<div class="key" id="keyPoints"></div>
</div>
</div>

<script>
(function(){
const scenes=[
{
title:"1. What Is a Job Interview?",
topic:"Introduction",
img:"job-interview-overview.png",
text:"A job interview is a formal conversation between a job applicant and an interviewer. The purpose is to find out whether the candidate has the right education, skills, experience, attitude, communication, motivation, teamwork, and professional ability.",
points:[
["Applicant","The person who applies for a job."],
["Interviewer","The person who asks questions and evaluates the candidate."],
["Main purpose","To find out whether the candidate is suitable for the position."]
]
},
{
title:"2. Greeting and Introduction",
topic:"Stage 1–2: Greeting and Introduction",
img:"job-interview-overview.png",
text:"The interview usually begins with a polite greeting. After greeting the interviewer, introduce yourself briefly. State your name, recent graduation, and major. Keep your introduction clear and professional.",
points:[
["Useful expression","Good morning. Thank you for inviting me to this interview."],
["Introduction","My name is Rudi. I recently graduated from SMK."],
["Major","I majored in Computer and Network Engineering."]
]
},
{
title:"3. Talking About Education",
topic:"Stage 3: Education",
img:"job-interview-expressions.png",
text:"When the interviewer asks about your educational background, mention your school, graduation, and major. You can also mention subjects or knowledge that are relevant to the position.",
points:[
["Example","I graduated from SMK in 2026."],
["Example","I majored in Software Engineering."],
["Example","I studied Computer and Network Engineering."]
]
},
{
title:"4. Talking About Experience",
topic:"Stage 4: Experience",
img:"job-interview-expressions.png",
text:"For a fresh graduate, internship or PKL experience is very useful. Explain where you completed your internship, what you did, and what you learned. Focus on skills and workplace habits.",
points:[
["Example","I completed my internship at a manufacturing company."],
["Example","During my internship, I worked with the maintenance team."],
["Learning","I learned how to work in a team and maintain machines."]
]
},
{
title:"5. Talking About Skills",
topic:"Stage 5: Technical and Soft Skills",
img:"job-interview-expressions.png",
text:"Skills can be divided into technical skills and soft skills. Technical skills are practical abilities related to your field. Soft skills describe how you communicate, cooperate, solve problems, and manage your work.",
points:[
["Technical","AutoCAD, computer troubleshooting, networking, machinery, or website development."],
["Soft skills","Communication, teamwork, problem solving, and time management."],
["Useful expression","I have good communication skills."]
]
},
{
title:"6. Talking About Strengths",
topic:"Stage 6: Strengths",
img:"job-interview-expressions.png",
text:"When talking about your strengths, do not simply say that you are good. Give a specific strength and, when possible, support it with an example from school, PKL, or a project.",
points:[
["Strength","I am hardworking and responsible."],
["Strength","I am a fast learner."],
["Strong pattern","One of my strengths is teamwork. During my internship, I worked with several team members to complete a project on time."]
]
},
{
title:"7. Talking About Weaknesses",
topic:"Stage 6: Weaknesses",
img:"job-interview-expressions.png",
text:"When discussing a weakness, avoid extremely negative statements. A better strategy is to mention a genuine area for improvement and explain what you are doing to improve it.",
points:[
["Avoid","I am lazy. I don't like working."],
["Better pattern","One of my weaknesses is that I sometimes feel nervous when speaking in front of many people."],
["Improvement","However, I am working on this by practicing presentations regularly."]
]
},
{
title:"8. Why Do You Want This Job?",
topic:"Stage 7: Motivation",
img:"job-interview-expressions.png",
text:"Your answer should show that you are interested in the position and that it matches your skills or career development. Avoid making salary the only reason you want the job.",
points:[
["Example","I want to work for your company because it is a good place to develop my technical skills."],
["Another example","I am interested in this position because it matches my education and skills."],
["Key idea","Connect your motivation with the position and the company."]
]
},
{
title:"9. Why Should We Hire You?",
topic:"Stage 7: Motivation and Self-Presentation",
img:"job-interview-expressions.png",
text:"This question gives you an opportunity to summarize your value. Mention relevant technical skills, internship experience, positive attitudes, and willingness to learn. Be confident without sounding arrogant.",
points:[
["Example","I believe I am suitable for this position because my educational background and internship experience match the requirements."],
["Add","I am responsible, motivated, and willing to learn new skills."],
["Remember","Confidence is good; comparing yourself negatively with other candidates is not."]
]
},
{
title:"10. Career Goals and Closing",
topic:"Stage 8–9: Career Goals and Closing",
img:"job-interview-expressions.png",
text:"For your five-year goal, describe realistic professional development. At the end of the interview, ask a relevant question and thank the interviewer for the opportunity.",
points:[
["Career goal","In five years, I hope to become an experienced technician and take on more responsibilities."],
["Good question","What kind of training does the company provide?"],
["Closing","Thank you for your time. I appreciate the opportunity to speak with you."]
]
}
];

let current=0, playing=false, voiceOn=true, timer=null;

const visual=document.getElementById("visual");
const scene=document.getElementById("scene");
const topic=document.getElementById("topic");
const lessonTitle=document.getElementById("lessonTitle");
const lessonText=document.getElementById("lessonText");
const narration=document.getElementById("narration");
const keyPoints=document.getElementById("keyPoints");
const bar=document.getElementById("bar");
const counter=document.getElementById("counter");
const play=document.getElementById("play");
const voice=document.getElementById("voice");

function render(){
const s=scenes[current];
visual.src=s.img;
scene.textContent=s.title;
topic.textContent=s.topic;
lessonTitle.textContent=s.title.replace(/^\d+\.\s*/,"");
lessonText.textContent=s.text;
narration.textContent=s.text;
counter.textContent=(current+1)+"/"+scenes.length;
bar.style.width=((current+1)/scenes.length*100)+"%";
keyPoints.innerHTML="";
s.points.forEach(function(p){
const div=document.createElement("div");
div.className="box";
div.innerHTML="<h3>"+p[0]+"</h3><p>"+p[1]+"</p>";
keyPoints.appendChild(div);
});
}

function speak(){
if(!voiceOn || !("speechSynthesis" in window)) return;
window.speechSynthesis.cancel();
const s=scenes[current];
const text=s.title+". "+s.text+". "+s.points.map(p=>p[0]+". "+p[1]).join(". ");
const u=new SpeechSynthesisUtterance(text);
u.lang="en-US"; u.rate=0.88; u.pitch=1;
window.speechSynthesis.speak(u);
}

function schedule(){
clearTimeout(timer);
timer=setTimeout(function(){
if(current<scenes.length-1){current++;render();speak();schedule();}
else{stop();}
},9000);
}

function start(){
playing=true;play.textContent="⏸ Pause Lesson";
render();speak();schedule();
}

function stop(){
playing=false;clearTimeout(timer);play.textContent="▶ Play Lesson";
if("speechSynthesis" in window) window.speechSynthesis.cancel();
}

play.onclick=function(){if(playing) stop(); else start();};
voice.onclick=function(){
voiceOn=!voiceOn;
voice.textContent=voiceOn?"🔊 Voice: ON":"🔇 Voice: OFF";
if(!voiceOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
else if(playing) speak();
};

document.getElementById("next").onclick=function(){
stop(); if(current<scenes.length-1) current++; render(); if(voiceOn)speak();
};
document.getElementById("back").onclick=function(){
stop(); if(current>0) current--; render(); if(voiceOn)speak();
};
document.getElementById("timeline").onclick=function(e){
const r=e.currentTarget.getBoundingClientRect();
current=Math.round(((e.clientX-r.left)/r.width)*(scenes.length-1));
stop();render();if(voiceOn)speak();
};

render();
})();
</script>
</body>
</html>
